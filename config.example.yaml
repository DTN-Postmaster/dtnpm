# ==============================================================================
# dtnpm: DTN Postmaster BPv7 Bundle Processing Node Configuration
# ==============================================================================
# Format: YAML (TOML is also supported transparently by dtnpm)
#
# Quick start:
#   1. Copy this file to config.yaml
#   2. Edit your callsign / node-id below
#   3. Run: dtnpm -c config.yaml
# ==============================================================================

# Node Identification
# --------------------
# Administrative callsign (optional shorthand)
callsign: "N0CALL"

# Primary Administrative Node EID (RFC 9171)
# Typically dtn://<callsign>/ or ipn:<node_number>.0
node-id: "dtn://n0call/"

# Additional admin EID endpoints this node accepts bundles for
admin-endpoints: []

# Persistent Storage
# ------------------
storage:
  # Directory where SQLite database and file bundle payloads are kept
  data-dir: "~/.local/share/dtnpm"
  # Set to true for ephemeral, non-persistent in-memory operation
  in-memory: false

# Application Services & Storage Quota
# ------------------------------------
application:
  quota:
    # Maximum disk storage dedicated to application data (payloads + database).
    # When this quota is reached, a 4-tier LRU cascade safely reclaims space:
    # (Expired Chats -> Expired Files -> Active Chats -> Active Files).
    # Sticky messages and files are strictly protected and never deleted.
    # Supported formats: "300MB", "300MiB", "1GB", etc. (Default: 300MB)
    max-storage: "300MB"

# Local gRPC Interface (for CLI utilities: dtnsend, dtnprint, dtntrigger, dtnfiles)
# ---------------------------------------------------------------------------------
grpc:
  enabled: true
  address: "[::]:50051"

# Web Dashboard & REST API
# -------------------------
web:
  # Listening socket for browser access (Interactive Chat, Files, Diagnostics)
  address: "127.0.0.1:8080"
  # Directory containing precompiled web assets (embedded by default in releases)
  # static-dir: "web/dist"

# Convergence Layer Adapters (CLAs)
# ---------------------------------
clas:
  - name: "tcpcl-hamnet"
    type: "tcpclv4"
    address: "[::]:4556"
    # Plaintext mode (RFC 9174 without TLS) compliant with amateur radio rules
    require-tls: false
    # Optional APRS CLA/band aliases (automatic transport tag 'TCPCL' is also added)
    aliases: ["44NET"]
    peers: []

  # Example: AX.25 KISS TNC via Direwolf soundmodem TCP port
  # - name: "kiss-vhf"
  #   type: "hqfbp"
  #   callsign: "N0CALL-1"
  #   aliases: ["VHF", "2M"]
  #   transport:
  #     type: "tcp"
  #     address: "127.0.0.1:8001"
  #     port: 0

  # Example: LTP (Licklider Transmission Protocol RFC 5326) over UDP
  # - name: "ltp-udp"
  #   type: "ltp"
  #   engine-id: 1001
  #   aliases: ["QO100"]
  #   transport:
  #     type: "udp"
  #     bind-addr: "0.0.0.0:1113"

  # Example: File-based CLAs (Sneakernet / USB drive / external software bridge)
  # Multiple instances can target different directories and APRS aliases;
  # automatic transport tag 'FILE' is added to every file-cla instance.
  # - name: "file-usb"
  #   type: "file-cla"
  #   aliases: ["USB"]
  #   max-bundle-size: "64MB"
  #   # External tool / USB copy drops raw BPv7 bundles here -> dtnpm ingests & deletes
  #   outbox: "~/dtn-spool/usb/outbox"
  #   # dtnpm writes outgoing bundles for each peer EID into its inbox directory
  #   peers:
  #     "dtn://f4usb/": "~/dtn-spool/usb/inbox"
  #
  # - name: "file-ext-tool"
  #   type: "file-cla"
  #   aliases: ["EXT"]
  #   outbox: "/var/spool/dtn-ext/outbox"
  #   peers:
  #     "dtn://f4ext/": "/var/spool/dtn-ext/inbox"

# Unified OPA/Rego Routing & Built-in ANSRVR Group Service (ADR-0001)
# --------------------------------------------------------------------
rego-routing:
  record-treb: false
  ansrvr:
    enabled: true
    service-name: "ansrvr"
    default-ttl-secs: 86400
    cq-rate-limit-secs: 15

# Static Routing Rules (FALLBACK layer for plain bundles)
# -------------------------------------------------------
# Direct connected peers, APRS strict/CLA/group aliases, and Spray-and-Wait
# are routed automatically by the embedded routing.rego policy.
routes:
  - pattern: "dtn://gateway/*"
    cla: "tcpcl-hamnet"
    next-hop: "dtn://gateway/"

# RFC 9171 Ingress Validation Policy
# ----------------------------------
rfc9171-validity:
  # Set false for maximum interoperability with dtn-android-messenger and dtn7-rs
  primary-block-integrity: false
  bundle-age-required: false

# Nginx + SSOwat reverse proxy configuration example for YunoHost
# Pairs with `examples/config-iam-yunohost.toml` (`auth.mode = "proxy"`).
#
# SSOwat populates `$remote_user` / `$email` and verifies user permissions.
# dtnpm rejects identity headers unless the peer IP belongs to `[auth.proxy].trusted-proxies`.

location /dtnpm/ {
    # Rewrite path if dtnpm is served under a subpath (adjust if mounted at /)
    rewrite ^/dtnpm/(.*)$ /$1 break;

    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;

    # Preserve client IP and protocol
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Identity headers injected ONLY by the trusted Nginx/SSOwat proxy
    proxy_set_header Remote-User $remote_user;
    proxy_set_header Remote-Email $email;
    # Optionally map a YunoHost group or admin flag into X-DTN-Role (Admin | Operator)
    # proxy_set_header X-DTN-Role $dtn_role;

    # Enable WebSocket / SSE streaming support (/api/v1/events)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;

    # SSOwat panel script injection (standard YunoHost snippet)
    include conf.d/yunohost_panel.conf.inc;
}

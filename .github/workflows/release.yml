# Expects sibling dtnpm-* checkouts (`../dtnpm-*`), hardy (`../../hardy`), and hqfbp-rs (`../../hqfbp-rs`).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-web:
    name: Build Embedded Preact WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dtnpm-web-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-web-core
          path: dtn-postmaster/dtnpm-web-core
      - name: Checkout dtnpm
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: dtn-postmaster/dtnpm-web-core/ui/pnpm-lock.yaml
      - name: Build Preact WebUI bundle
        working-directory: dtn-postmaster/dtnpm-web-core/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: dtn-postmaster/dtnpm-web-core/ui/dist

  package:
    name: Package (${{ matrix.name }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_zigbuild: false
            archive_ext: tar.gz
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_zigbuild: true
            archive_ext: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_zigbuild: false
            archive_ext: zip
          - name: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            use_zigbuild: false
            archive_ext: tar.gz

    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout hqfbp-rs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
          ref: feat/remove-max-payload-size
      - name: Checkout dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-web-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-web-core
          path: dtn-postmaster/dtnpm-web-core
      - name: Checkout dtnpm-cla-ltp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-ltp-kiss
          path: dtn-postmaster/dtnpm-cla-ltp-kiss
      - name: Checkout dtnpm-cla-hqfbp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-hqfbp-kiss
          path: dtn-postmaster/dtnpm-cla-hqfbp-kiss
      - name: Checkout dtnpm-cla-mercury-arq
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-mercury-arq
          path: dtn-postmaster/dtnpm-cla-mercury-arq
      - name: Checkout dtnpm-mod-chat
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-chat
          path: dtn-postmaster/dtnpm-mod-chat
      - name: Checkout dtnpm-mod-files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-files
          path: dtn-postmaster/dtnpm-mod-files
      - name: Checkout dtnpm-mod-senml
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-senml
          path: dtn-postmaster/dtnpm-mod-senml
      - name: Checkout dtnpm-mod-rego-routing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-rego-routing
          path: dtn-postmaster/dtnpm-mod-rego-routing
      - name: Checkout dtnpm
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: dtn-postmaster/dtnpm-web-core/ui/dist

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-29.3-${{ runner.os }}
      - name: Install protoc (Unix cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            ASSET="protoc-29.3-osx-universal_binary.zip"
          else
            ASSET="protoc-29.3-linux-x86_64.zip"
          fi
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${ASSET}"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Install protoc (Windows cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip" -OutFile "$env:TEMP\protoc.zip"
          New-Item -ItemType Directory -Force -Path "$HOME/.local/protoc" | Out-Null
          Expand-Archive -Path "$env:TEMP\protoc.zip" -DestinationPath "$HOME/.local/protoc" -Force
      - name: Add protoc to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - name: Add protoc to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$HOME\.local\protoc\bin"

      - name: Install cargo-zigbuild and zig
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tool: cargo-zigbuild
      - name: Install zig (for cargo-zigbuild)
        if: matrix.use_zigbuild
        run: |
          python3 -m pip install --user --break-system-packages ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm

      - name: Build binaries (Linux native)
        if: matrix.name == 'linux-x86_64'
        working-directory: dtn-postmaster/dtnpm
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binaries (Linux zigbuild)
        if: matrix.use_zigbuild
        working-directory: dtn-postmaster/dtnpm
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build binaries (Windows)
        if: matrix.name == 'windows-x86_64'
        working-directory: dtn-postmaster/dtnpm
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binaries (macOS universal)
        if: matrix.name == 'macos-universal'
        working-directory: dtn-postmaster/dtnpm
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          for bin in dtnpm dtnbib dtnfiles dtnforward dtnping dtnprint dtnquery dtnsend dtntrigger hdy-stats; do
            lipo -create target/x86_64-apple-darwin/release/$bin target/aarch64-apple-darwin/release/$bin -output target/universal-apple-darwin/release/$bin
          done

      - name: Download built WebUI bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: dtn-postmaster/dtnpm/web/dist

      - name: Package archive (Unix)
        if: matrix.archive_ext == 'tar.gz'
        working-directory: dtn-postmaster/dtnpm
        run: |
          PKG_DIR="dtnpm-${{ matrix.name }}"
          mkdir -p "$PKG_DIR/web"
          for bin in dtnpm dtnbib dtnfiles dtnforward dtnping dtnprint dtnquery dtnsend dtntrigger hdy-stats; do
            cp "target/${{ matrix.target }}/release/$bin" "$PKG_DIR/"
          done
          cp config.example.yaml config.example.toml dtnpm.service dtn-hdy-ham.service README.md LICENSE.md SECURITY.md "$PKG_DIR/"
          cp -r examples "$PKG_DIR/"
          cp -r web/dist "$PKG_DIR/web/"
          tar czf "${PKG_DIR}.tar.gz" "$PKG_DIR"

      - name: Package archive (Windows)
        if: matrix.archive_ext == 'zip'
        working-directory: dtn-postmaster/dtnpm
        shell: pwsh
        run: |
          $pkgDir = "dtnpm-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          foreach ($bin in @("dtnpm.exe", "dtnbib.exe", "dtnfiles.exe", "dtnforward.exe", "dtnping.exe", "dtnprint.exe", "dtnquery.exe", "dtnsend.exe", "dtntrigger.exe", "hdy-stats.exe")) {
            Copy-Item "target/${{ matrix.target }}/release/$bin" "$pkgDir/"
          }
          Copy-Item config.example.yaml, config.example.toml, README.md, LICENSE.md, SECURITY.md "$pkgDir/"
          Copy-Item -Recurse examples "$pkgDir/examples"
          Copy-Item -Recurse web "$pkgDir/web"
          Compress-Archive -Path $pkgDir -DestinationPath "${pkgDir}.zip" -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}
          path: dtn-postmaster/dtnpm/dtnpm-${{ matrix.name }}.${{ matrix.archive_ext }}

  sbom:
    name: Generate Release CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout hqfbp-rs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
          ref: feat/remove-max-payload-size
      - name: Checkout dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-web-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-web-core
          path: dtn-postmaster/dtnpm-web-core
      - name: Checkout dtnpm-cla-ltp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-ltp-kiss
          path: dtn-postmaster/dtnpm-cla-ltp-kiss
      - name: Checkout dtnpm-cla-hqfbp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-hqfbp-kiss
          path: dtn-postmaster/dtnpm-cla-hqfbp-kiss
      - name: Checkout dtnpm-cla-mercury-arq
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-mercury-arq
          path: dtn-postmaster/dtnpm-cla-mercury-arq
      - name: Checkout dtnpm-mod-chat
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-chat
          path: dtn-postmaster/dtnpm-mod-chat
      - name: Checkout dtnpm-mod-files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-files
          path: dtn-postmaster/dtnpm-mod-files
      - name: Checkout dtnpm-mod-senml
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-senml
          path: dtn-postmaster/dtnpm-mod-senml
      - name: Checkout dtnpm-mod-rego-routing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-rego-routing
          path: dtn-postmaster/dtnpm-mod-rego-routing
      - name: Checkout dtnpm
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dtn-postmaster/dtnpm
          output-file: dtn-postmaster/dtnpm/sbom.cdx.json
          format: cyclonedx-json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom
          path: dtn-postmaster/dtnpm/sbom.cdx.json

  publish-release:
    name: Publish GitHub Release
    needs: [package, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626b5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: artifacts/*

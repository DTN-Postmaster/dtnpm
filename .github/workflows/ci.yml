          path: dtn-postmaster/dtnpm-mod-senml
      - name: Checkout dtnpm-mod-rego-routing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-rego-routing
          path: dtn-postmaster/dtnpm-mod-rego-routing
      - name: Checkout dtnpm
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tool: cargo-audit, cargo-deny, gitleaks
      - name: Run strict security checks
        working-directory: dtn-postmaster/dtnpm
        run: ./scripts/check-security.sh --strict


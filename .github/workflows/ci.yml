# Expects sibling dtnpm-* checkouts (`../dtnpm-*`), hardy (`../../hardy`), and hqfbp-rs (`../../hqfbp-rs`).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: Test Suite, Profile Checks & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dtn-postmaster/dtnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dtn-postmaster/dtnpm
      - name: Formatting check
        working-directory: dtn-postmaster/dtnpm
        run: cargo fmt --all -- --check
      - name: Strict Clippy check (production targets)
        working-directory: dtn-postmaster/dtnpm
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::panic
      - name: Run cargo test --all-targets (default emcom,cli)
        working-directory: dtn-postmaster/dtnpm
        run: cargo test --all-targets
      - name: Check distribution feature profiles
        working-directory: dtn-postmaster/dtnpm
        run: |
          cargo check --no-default-features --features amsat
          cargo check --no-default-features --features node-headless
          cargo check --no-default-features --features webui-remote
          cargo check --no-default-features --features "emcom,instrument"
          cargo check --no-default-features --features "webui-remote,cli"
      - name: Generate CycloneDX / SPDX SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: dtn-postmaster/dtnpm
          output-file: dtn-postmaster/dtnpm/sbom.json
          format: cyclonedx-json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dtnpm
          path: dtn-postmaster/dtnpm/sbom.json

  security-audit:
    name: Security & License Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dtn-postmaster/dtnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dtn-postmaster/dtnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit, cargo-deny, gitleaks
      - name: Run strict security checks
        working-directory: dtn-postmaster/dtnpm
        run: ./scripts/check-security.sh --strict

  code-coverage:
    name: Code Coverage (LCOV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dtn-postmaster/dtnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dtn-postmaster/dtnpm
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate LCOV coverage report
        working-directory: dtn-postmaster/dtnpm
        run: ./scripts/check-coverage.sh --lcov
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dtnpm
          path: dtn-postmaster/dtnpm/lcov.info

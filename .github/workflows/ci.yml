# Expects sibling dtnpm-* checkouts (`../dtnpm-*`), hardy (`../../hardy`), and hqfbp-rs (`../../hqfbp-rs`).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: Test Suite, Profile Checks & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hardy DTN workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hardy
          path: hardy
          ref: main-dtnpm
      - name: Checkout hqfbp-rs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: loic-fejoz/hqfbp-rs
          path: hqfbp-rs
      - name: Checkout dtnpm-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-core
          path: dtn-postmaster/dtnpm-core
      - name: Checkout dtnpm-web-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-web-core
          path: dtn-postmaster/dtnpm-web-core
      - name: Checkout dtnpm-cla-ltp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-ltp-kiss
          path: dtn-postmaster/dtnpm-cla-ltp-kiss
      - name: Checkout dtnpm-cla-hqfbp-kiss
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-hqfbp-kiss
          path: dtn-postmaster/dtnpm-cla-hqfbp-kiss
      - name: Checkout dtnpm-cla-mercury-arq
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-cla-mercury-arq
          path: dtn-postmaster/dtnpm-cla-mercury-arq
      - name: Checkout dtnpm-mod-chat
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-chat
          path: dtn-postmaster/dtnpm-mod-chat
      - name: Checkout dtnpm-mod-files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-files
          path: dtn-postmaster/dtnpm-mod-files
      - name: Checkout dtnpm-mod-senml
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-senml
          path: dtn-postmaster/dtnpm-mod-senml
      - name: Checkout dtnpm-mod-rego-routing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dtn-postmaster/dtnpm-mod-rego-routing
          path: dtn-postmaster/dtnpm-mod-rego-routing
      - name: Checkout dtnpm
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: dtn-postmaster/dtnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Cache protoc
        id: protoc-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/protoc
          key: protoc-29.3-linux-x86_64
      - name: Install protoc (cache miss)
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip"
          mkdir -p "$HOME/.local/protoc"
          unzip -q /tmp/protoc.zip -d "$HOME/.local/protoc"
      - name: Add protoc to PATH
        run: echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: dtn-postmaster/dtnpm
      - name: Formatting check
        working-directory: dtn-postmaster/dtnpm
        run: cargo fmt --all -- --check
      - name: Strict Clippy check (production targets)
        working-directory: dtn-postmaster/dtnpm
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::panic
      - name: Run cargo test --all-targets (default desktop,cli)
        working-directory: dtn-postmaster/dtnpm
        run: cargo test --all-targets
      - name: Check distribution feature profiles
        working-directory: dtn-postmaster/dtnpm
        run: |
          cargo check --no-default-features --features amsat
          cargo check --no-default-features --features node-headless
          cargo check --no-default-features --features webui-remote
          cargo check --no-default-features --features "desktop,instrument"
          cargo check --no-default-features --features "webui-remote,cli"
      - name: Generate CycloneDX / SPDX SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dtn-postmaster/dtnpm
          output-file: dtn-postmaster/dtnpm/sbom.json
          format: cyclonedx-json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-dtnpm
          path: dtn-postmaster/dtnpm/sbom.json

